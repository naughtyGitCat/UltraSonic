# XcodeGen spec. On the Mac:  brew install xcodegen && xcodegen generate && open UltraSonic.iOS.xcodeproj
# (The generated .xcodeproj is gitignored — this YAML + Sources/ are the source of truth.)
name: UltraSonic.iOS
options:
  bundleIdPrefix: com.ultrasonic
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
settings:
  base:
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.9"
    # Set your Apple Developer Team ID here (or in Xcode > Signing & Capabilities).
    DEVELOPMENT_TEAM: ""
targets:
  UltraSonic.iOS:
    type: application
    platform: iOS
    sources:
      - path: Sources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ultrasonic.ios
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Sources/Support/Info.plist
        TARGETED_DEVICE_FAMILY: "1,2"
